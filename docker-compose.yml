version: '3.8'
services:
  attendancemiddleware-without-db:
    container_name: attendance.middleware
    image: ${DOCKER_REGISTRY-}attendancemiddlewarewithoutdb
    build:
      context: .
      dockerfile: AttendanceMiddleware-without-db/Dockerfile
    ports:
      - "7070:8080"
      - "7071:8081"
    environment:
      - RabbitMQ__Host=middleware-rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__VirtualHost=/
      - HrmRabbitMQ__Host=rabbitmq
      - HrmRabbitMQ__Port=5672
      - HrmRabbitMQ__Username=guest
      - HrmRabbitMQ__Password=guest
      - HrmRabbitMQ__VirtualHost=/
      - ConnectionStrings__DefaultConnection=Server=middleware-sqlserver,1433;Database=AttendanceMiddleware;User Id=sa;Password=Your_Password123;TrustServerCertificate=True;
    depends_on:
      - middleware-rabbitmq
      - middleware-sqlserver
    networks:
      - middleware-network
      - antlerhrm

  middleware-rabbitmq:
    container_name: middleware-rabbitmq
    image: masstransit/rabbitmq:latest
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - middleware-network

  middleware-sqlserver:
    container_name: middleware-sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1434:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_Password123
      - MSSQL_PID=Express
    volumes:
      - middleware-sqlserver-data:/var/opt/mssql
    networks:
      - middleware-network

volumes:
  middleware-sqlserver-data:

networks:
  middleware-network:
    driver: bridge
  antlerhrm:
    external: true
    name: dockercompose13062976144894918685_antlerhrm